<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>臨床推理教室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: projector = case sheet (left) + differential board (right); phone = one column that follows the TA. Heat = amber, like concentrated urine. */
:root{
  --paper:#EEF1F4; --sheet:#FFFFFF; --ink:#18212F; --muted:#5A6576; --rule:#D5DBE3;
  --heat:#E3A008; --heat-ink:#6E4A00; --key:#3A3FB4; --key-soft:#E6E7FA;
  --up:var(--key); --down:#5A6576; --out:#9AA3AF; --lead:var(--key); --good:var(--key); --bad:#B91C1C;
  --f-body:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --f-display:var(--f-body);
  --f-data:var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141B; --sheet:#171E28; --ink:#E5E9EF; --muted:#9AA5B4; --rule:#2A3442;
  --heat:#F2B52A; --heat-ink:#FFE3A3; --key:#9599FF; --key-soft:#252A55;
  --up:var(--key); --down:#9AA5B4; --out:#6E7886; --lead:var(--key); --good:var(--key); --bad:#F87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F141B; --sheet:#171E28; --ink:#E5E9EF; --muted:#9AA5B4; --rule:#2A3442;
  --heat:#F2B52A; --heat-ink:#FFE3A3; --key:#9599FF; --key-soft:#252A55;
  --up:var(--key); --down:#9AA5B4; --out:#6E7886; --lead:var(--key); --good:var(--key); --bad:#F87171; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--key);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px;border-bottom:1px solid var(--rule);margin-bottom:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.brand{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:0}
.brand small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px;margin-left:8px;letter-spacing:0}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted)}
.steps button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps button.done{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--heat);color:#2A1C00;font-weight:700}
.seg button:disabled{opacity:.35;cursor:default}
.course-sel{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:inherit;padding:5px 8px;font-size:13px;font-family:inherit}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--out)}
.dot.ok{background:var(--lead)}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:5px 12px;font-size:13px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
.note{font-size:13px;color:var(--muted);background:var(--sheet);border:1px dashed var(--rule);border-radius:8px;padding:8px 12px;margin-bottom:14px}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:22px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:22px 24px;min-width:0}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.sec-no{font-family:var(--f-data);color:var(--muted);font-size:13px}
.sec-title{font-family:var(--f-display);font-size:24px;font-weight:700}
.prompt{color:var(--muted);font-size:16px;margin:0 0 18px}
.statement{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1.35;margin:18px 0 22px;text-wrap:balance}
.ask{font-size:20px;line-height:1.8;margin:0;padding-left:1.3em}
.phone .statement{font-size:28px}
.phone .ask{font-size:16px}
.board .wait{font-size:16px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}

/* case units */
.units.prose{font-size:20px;line-height:2}
.units.list{display:grid;gap:6px}
.grp{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:12px 0 2px;font-weight:700}
.grp:first-child{margin-top:0}
.u{position:relative;border:1.5px solid transparent;border-radius:6px;padding:1px 6px;background:transparent;text-align:left;line-height:inherit;font-size:inherit}
.units.prose .u{cursor:pointer;padding:0 3px;border-radius:4px;display:inline;-webkit-box-decoration-break:clone;box-decoration-break:clone;margin-right:4px}
.units.list .u{display:flex;align-items:baseline;gap:10px;font-size:16px;padding:6px 10px;border-color:var(--rule)}
.units.list .u .lab{min-width:0}
.units.list.data .u{font-family:var(--f-data);font-size:16px}
.u .cnt{font-family:var(--f-data);font-size:13px;font-weight:500;color:var(--heat-ink);background:var(--sheet);border:1px solid var(--heat);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:middle;line-height:1.5;white-space:nowrap}
.units.list .u .cnt{margin-left:auto}
.u.key{border-color:var(--key)!important;box-shadow:inset 0 0 0 1px var(--key)}
.u .tag{font-size:13px;font-family:var(--f-body);color:var(--sheet);background:var(--key);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle;line-height:1.6;white-space:nowrap}
.units.list .u .tag{margin-left:6px}
.units.list .u .cnt+.tag{margin-left:6px}
.units.list .u{flex-wrap:wrap}
.assoc{flex-basis:100%;font-size:16px;line-height:1.6;color:var(--key);margin-top:2px}
.assoc.tst{color:var(--ink)}.assoc.tst b{color:var(--key);font-weight:700}
.maplist{margin:6px 0;padding-left:1.2em}.maplist li{font-size:16px;line-height:1.75}
.phone .assoc{font-size:16px}
.u.pick{background:color-mix(in srgb,var(--heat) 45%,transparent)}
.u.hit{border-color:var(--key)}
.u.miss{border-color:var(--key);border-style:dashed}
.u.extra{border-color:var(--rule)}
.mk{font-size:13px;font-weight:700;margin-left:auto;white-space:nowrap;color:var(--muted)}
.u.hit .mk{color:var(--key)}
.more{position:relative}
.more summary{list-style:none;cursor:pointer;user-select:none}
.more summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:6;display:grid;gap:4px;padding:6px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;min-width:130px}
.more .menu .btn{text-align:left;white-space:nowrap}

/* analysis + cards */
.analysis{margin-top:22px;border-top:2px solid var(--key);padding-top:14px}
.analysis h3{font-size:13px;letter-spacing:.1em;color:var(--key);margin-bottom:6px}
.analysis p,.analysis li{font-size:16px;line-height:1.75;max-width:62em}
.analysis ol,.analysis ul{padding-left:1.4em;margin:6px 0}
.analysis p{margin:6px 0}
.cards{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;align-items:center}
.cards .lbl{font-size:13px;color:var(--muted);letter-spacing:.08em;margin-right:4px}
.cardbtn{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 12px;font-size:13px}
.cardbtn.on{border-color:var(--key);color:var(--key)}
.cardbody{margin-top:10px;background:var(--key-soft);border-radius:8px;padding:12px 14px;font-size:16px;max-width:62em}
.src{display:inline-block;font-size:13px;border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px;border:1px solid currentColor}
.src.t{color:var(--key)} .src.s{color:var(--muted)}

/* board */
.board{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 10px;min-width:0}
.board h2{font-family:var(--f-display);font-size:16px;margin-bottom:2px}
.board .sub{font-size:13px;color:var(--muted);margin-bottom:10px}
.dx{border-top:1px solid var(--rule);padding:9px 0}
.dx-top{display:flex;align-items:center;gap:8px}
.dxname{border:0;background:none;padding:0;text-align:left;font-weight:500;font-size:16px;min-width:0}
.dxname:hover{color:var(--key)}
.new{font-size:13px;color:var(--heat-ink);border:1px solid var(--heat);border-radius:4px;padding:0 4px;margin-left:4px}
.chip{margin-left:auto;font-size:13px;border-radius:999px;padding:1px 9px;white-space:nowrap;border:1px solid var(--rule);color:var(--muted)}
.chip.up{color:var(--up);border-color:var(--up)} .chip.down{color:var(--down);border-color:var(--down)}
.chip.out{color:var(--out);border-color:var(--out)} .chip.lead{background:var(--lead);border-color:var(--lead);color:var(--sheet);font-weight:700}
.dx.out .dxname{color:var(--out);text-decoration:line-through}
.dx.changed{background:none}
.mine{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.mine.diff{color:var(--ink);font-weight:700}
.mine+.chip{margin-left:10px}
.chip{border:0!important;background:none!important;padding:0!important;font-weight:700}
.chip.lead{color:var(--lead)!important}
.new{display:none}
.subhd{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:8px 0 2px 18px;border-top:1px solid var(--rule)}
.dx.child,.vote.child{margin-left:18px;padding-left:10px;border-left:2px solid var(--rule);border-top:0}
.why{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.55}
.dx.changed .why{color:var(--ink)}
.dxcard{font-size:13px;margin:6px 0 0;padding:8px 10px;border-left:3px solid var(--key);background:var(--paper);border-radius:0 6px 6px 0}
.bars{display:flex;height:22px;border-radius:4px;overflow:hidden;margin-top:6px;background:var(--paper);font-family:var(--f-data);font-size:13px}
.bars span{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0;overflow:hidden}
.bars .bu{background:var(--up)} .bars .bd{background:var(--down)} .bars .bk{background:var(--out)}
.legend{display:flex;gap:12px;font-size:13px;color:var(--muted);margin:2px 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.past{font-size:13px;color:var(--out);border-top:1px solid var(--rule);padding-top:8px;margin-top:4px}
.imp{border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;margin:8px 0 12px}
.imp h3{font-size:13px;letter-spacing:.08em;margin:0 0 4px}
.imp ol{margin:0;padding-left:1.4em;font-weight:700;line-height:1.6}
.imp .note{font-size:13px;color:var(--muted);font-weight:400;margin:4px 0 0;padding:0;background:none;border:0}
.listhd{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:6px 0 2px}

/* student */
.phone{max-width:600px;margin:0 auto}
.phone .sheet{padding:18px 16px}
.phone .sec-title{font-size:20px}
.phone .units.prose{font-size:16px;line-height:2}
.phone .units.list .u{font-size:16px}
.phone .units.list.data .u{font-size:16px}
.phase-tag{display:inline-block;background:var(--heat);color:#2A1C00;font-weight:700;font-size:13px;border-radius:999px;padding:1px 10px;margin-bottom:8px}
.vote{border-top:1px solid var(--rule);padding:10px 0}
.vote-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vbtns{display:flex;gap:4px;margin-left:auto}
.vbtns button{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 10px;font-size:13px;min-width:52px;white-space:nowrap}
.vbtns button.on.u{background:var(--up);border-color:var(--up);color:#fff}
.vbtns button.on.d{background:var(--down);border-color:var(--down);color:#fff}
.vbtns button.on.k{background:var(--out);border-color:var(--out);color:#fff}
.score{font-size:16px;background:var(--key-soft);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.cmp{font-size:13px;margin-top:4px}
.cmp b{font-weight:700}
.selfnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.vote.r-ok{background:color-mix(in srgb,var(--good) 13%,transparent);border-left:4px solid var(--good);padding-left:10px;border-radius:0 6px 6px 0}
.vote.r-bad{background:color-mix(in srgb,var(--out) 16%,transparent);border-left:4px solid var(--out);padding-left:10px;border-radius:0 6px 6px 0}
.res{display:inline-block;font-weight:700;padding:1px 9px;border-radius:999px;font-size:13px}
.res.ok{background:var(--good);color:var(--sheet)} .res.bad{background:var(--out);color:var(--sheet)} .res.none{border:1px solid var(--rule);color:var(--muted);font-weight:400}
.tally{font-size:13px;font-weight:700;margin-left:8px}
.fig{flex-basis:100%;display:block;margin-top:6px}.fig img{display:block;width:100%;max-width:460px;height:auto;border-radius:6px}.figcap{display:block;font-family:var(--f-body);font-size:13px;color:var(--muted);margin-top:4px}
.qrbox{display:flex;align-items:center;gap:18px;margin-top:26px;padding:14px 16px;border:1px dashed var(--rule);border-radius:10px;font-size:16px;line-height:1.7}
.qr{background:#fff;padding:8px;border-radius:8px;line-height:0;flex:none}.qr img,.qr canvas{display:block}
.muted{color:var(--muted);font-size:13px;font-family:var(--f-data)}
.foot{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
@media (prefers-reduced-motion:no-preference){.u{transition:background-color .35s,border-color .2s}}
</style>

<script>
/* ---------- case content (陳怡儒醫師教案；「補充」為助教補充，非教案原文) ---------- */
const DX = {
  prerenal:{name:'腎前性',intro:0,card:'腎臟本身沒壞，是「進去的血不夠」：脫水、出血、休克、心衰竭、腎動脈狹窄。GFR 下降，腎小管仍努力回收鈉和水，所以尿少而濃。'},
  intrinsic:{name:'腎因性',intro:0,card:'腎實質受損：腎小管（ATN）、腎絲球（腎絲球腎炎）、間質（間質性腎炎）、血管（血管炎、血栓）。腎前性拖太久也會變成腎因性。'},
  postrenal:{name:'腎後性',intro:0,card:'尿流不出去：雙側輸尿管或膀胱出口阻塞（只有單側阻塞時，另一顆腎通常撐得住）。腎臟超音波看有沒有水腎。'},
  pe:{name:'子癲前症',intro:1,card:'懷孕 20 週後新出現高血壓，合併蛋白尿或器官受損。胎盤釋放的 sFlt-1 上升、PlGF 下降。'},
  gn:{name:'腎絲球腎炎',intro:1,card:'腎絲球過濾膜受損：蛋白尿（泡泡尿）、血尿、水腫、高血壓。例如 IgA 腎病、狼瘡腎炎。懷孕可能讓原本穩定的疾病變得不穩定。'},
  sle:{name:'紅斑性狼瘡（SLE）',intro:2,card:'自體免疫疾病，可侵犯腎、血液、皮膚、關節、神經等多個器官。年輕女性多見，懷孕可能誘發發作；嚴重時可合併血栓性微血管病變。檢查 ANA、anti-dsDNA、C3/C4。'},
  aps:{name:'抗磷脂質症候群（APS）',intro:2,card:'抗磷脂抗體讓血液容易凝固：動靜脈血栓、反覆流產、子癲前症。少數會在短時間內多器官同時栓塞（catastrophic APS）。檢查 anticardiolipin、β2-glycoprotein I 抗體。'},
  ttp:{name:'TTP（血栓性血小板低下紫斑症）',intro:2,card:'ADAMTS13 酵素嚴重缺乏，切不斷超大型 vWF，血小板在小血管裡黏成血栓。表現：溶血性貧血＋血小板低下，常有神經症狀。'},
  ahus:{name:'aHUS（非典型溶血性尿毒症候群）',intro:2,card:'補體替代路徑失控（多與基因變異有關），持續攻擊血管內皮，腎臟受害最重。懷孕、產後、感染可觸發；可有家族史。治療：血漿置換、補體抑制劑。'},
  stechus:{name:'典型 HUS（STEC-HUS）',intro:2,card:'吃到產志賀毒素的大腸桿菌（如 O157:H7）後先腹瀉（常帶血），毒素傷害腎臟血管內皮。兒童較常見。'},
  hellp:{name:'HELLP 症候群',intro:2,card:'Hemolysis、Elevated Liver enzymes、Low Platelets。屬嚴重的子癲前症，多在第三孕期或產後，肝酵素會明顯上升。'},
  aflp:{name:'妊娠急性脂肪肝（AFLP）',intro:2,card:'多在第三孕期，肝細胞脂肪浸潤導致肝衰竭：黃疸、低血糖、凝血異常（PT 延長），可合併急性腎損傷。'},
  dic:{name:'DIC（瀰漫性血管內凝血）',intro:3,card:'凝血系統全面啟動後耗竭：PT/APTT 延長、fibrinogen 下降、D-dimer 上升、血小板下降。常繼發於敗血症、產科急症。'},
  aiha:{name:'AIHA（自體免疫溶血性貧血）',intro:3,card:'抗體附著在紅血球上造成溶血，Coombs test 陽性；抹片常見球形紅血球，不是破碎紅血球。'},
};

const SECTIONS = [
{ id:'cc', no:'(1)', title:'主訴', phases:['ask','reveal'],
  imp:['腎前性','腎因性','腎後性'], impNote:'資料太少，三個方向都還在，先不排序。',
  statement:'28 歲女性，尿量變少三天',
  ask:['你會先確認什麼？','可能的鑑別診斷有哪些？'],
  cards:[
    {t:'寡尿的定義',src:'s',b:'成人每日尿量 &lt;400 mL（約 &lt;0.5 mL/kg/h 持續數小時）；每日 &lt;100 mL 稱為無尿。'},
    {t:'腎臟問題直覺',src:'s',b:'把腎臟想成濾水廠：<b>腎前性</b>＝進水不足；<b>腎因性</b>＝濾網壞了；<b>腎後性</b>＝出水管堵住。'}],
  verdict:{
    prerenal:{s:'keep',src:'t',why:'任何讓腎臟灌流不足的原因：嘔吐、腹瀉、燒傷、大出血、休克、嚴重低白蛋白、心律不整、心臟衰竭、腎動脈病變。'},
    intrinsic:{s:'keep',src:'t',why:'腎小管、腎絲球、血管病變，或腎前性惡化而來。'},
    postrenal:{s:'keep',src:'t',why:'女性要想到婦科：子宮肌瘤或懷孕壓迫雙側輸尿管（多半只壓單側）；年輕女性，癌症壓迫機會較低。'}},
  analysis:`<p><b>第一步：先懷疑是不是真的寡尿。</b>是「感覺尿變少」，還是真的量變少？整天如廁次數明顯下降、單次尿量明顯減少，才算寡尿。</p>
  <p><b>第二步：確定是寡尿 → 腎功能異常，分三個方向：</b></p>
  <ul>
  <li><b>腎前性</b>：任何讓腎臟灌流不足的原因，如嘔吐、腹瀉、大面積燒傷、大出血、休克、嚴重低白蛋白血症、嚴重心律不整、心臟衰竭，或腎動脈病變。</li>
  <li><b>腎因性</b>：各種腎實質病變（腎小管、腎絲球、血管），或腎前性惡化而來；可造成急性腎小管壞死、急性腎絲球腎炎、急性間質性腎炎、腎血管炎、血管栓塞。</li>
  <li><b>腎後性</b>：泌尿道阻塞。女性要想到婦科：子宮肌瘤或懷孕壓迫雙側輸尿管（多半只壓單側）；年輕女性，癌症壓迫機會較低。</li></ul>`},

{ id:'pmh', no:'(2-2)', title:'過去病史・家族史・系統回顧', layout:'list',

  askHint:'每一項讓你聯想到什麼？對診斷有什麼幫助？',
  units:[
    {id:'p1',g:'過去病史',t:'第一胎不明原因流產',a:'懷孕相關的系統性疾病：子癲前症？抗磷脂質症候群？先記下來，往下看能不能解釋。',as:'t'},
    {id:'p2',t:'當時被懷疑子癲前症，但 sFlt-1/PlGF 比值 <38',a:'比值低，不像典型子癲前症。',as:'t'},
    {id:'p3',t:'流產後一個月：醫師說有溶血性貧血與腎衰竭',a:'若流產是子癲前症，終止妊娠後溶血與腎功能應會恢復；沒有恢復＝有一個系統性疾病一直伴隨著她（SLE、APS、TTP、aHUS）。',as:'t'},
    {id:'p4',t:'這次懷孕 23 週：sFlt-1/PlGF = 18，醫師說不是子癲前症',a:'這一胎也不支持子癲前症 → 子癲前症可能性下降。',as:'t'},
    {id:'p5',t:'產檢：尿蛋白 3+、貧血',a:'蛋白尿與貧血在這次懷孕早就存在：腎絲球受損＋貧血是持續的問題，不是這三天才出現。',as:'s'},
    {id:'p6',t:'因貧血多吃牛肉、鐵劑、葉酸、B 群',a:'營養性貧血已經補足，又沒有腸胃道出血證據，貧血卻還在 → 要想溶血性貧血。',as:'t'},
    {id:'p7',g:'藥物・過敏・社會史',t:'Hydralazine',a:'有高血壓在治療；這個降壓藥不會造成腎衰竭或寡尿。',as:'t'},
    {id:'p8',t:'Vitamin B、葉酸、鐵劑',a:'這些藥也不會造成腎衰竭 → 藥物引起的腎損傷可以先放一邊。',as:'t'},

    {id:'p12',t:'哥哥 30 歲時不明原因中風',a:'年輕人中風＝小血管血栓的表現；和姊姊放在一起看，指向家族性的血栓性微血管病變。',as:'t'},
    {id:'p13',g:'系統回顧',t:'Dizziness (+)',a:'貧血加重（溶血）造成的頭暈。',as:'t'},
    {id:'p14',t:'Blurred vision (+)',a:'系統性疾病除了腎、心臟、腸胃，腦神經與眼睛可能也被影響（之後眼底鏡會驗證）。',as:'t'},
    {id:'p15',t:'Chest tightness and palpitation (+)',a:'心臟也被影響，和現病史的心衰竭症狀相呼應。',as:'t'},
    {id:'p16',t:'Cough (+)',a:'配合躺下更喘：肺水腫、心衰竭。',as:'s'},
    {id:'p17',t:'Hemoptysis (−)・Sputum (−)',a:'咳嗽不像肺部感染或肺出血。',as:'s'},

    {id:'p20',t:'Abdominal pain (−)・Bloody stool (−)・Diarrhea (−)',a:'沒有腹瀉、血便 → 不像典型 HUS（STEC）；沒有腹痛，也較不像 HELLP、AFLP 常見的上腹痛。',as:'s'}],
  cards:[
    {t:'sFlt-1/PlGF 比值',src:'s',b:'sFlt-1 是胎盤釋放的抗血管新生因子，PlGF 促進血管新生。子癲前症時 sFlt-1 上升、PlGF 下降，比值變高；<b>≤38</b> 時短期內發生子癲前症的機會很低。'},
    {t:'家族史為什麼重要',src:'s',b:'年輕人懷孕時多重器官衰竭、年輕就中風，都可能是<b>小血管血栓</b>的表現。一家人都有時，要想到遺傳性的補體調節異常。'}],
  verdict:{
    pe:{s:'down',src:'t',why:'兩次 sFlt-1/PlGF 都低（<38、18）；且流產後溶血與腎衰竭沒有恢復。若真是子癲前症，流產後應該會恢復。'},
    intrinsic:{s:'up',src:'t',why:'有一個系統性疾病一直伴隨著她。'},
    sle:{s:'up',src:'t',why:'流產後溶血性貧血、腎衰竭持續：要想系統性疾病。'},
    aps:{s:'up',src:'t',why:'不明原因流產＋持續的溶血與腎衰竭。'},
    ttp:{s:'up',src:'t',why:'溶血性貧血的疾病之一；姊姊、哥哥都有血栓性微血管病變的表現。'},
    ahus:{s:'up',src:'t',why:'姊姊懷孕時多重器官衰竭過世、哥哥年輕中風，都是明顯的血栓性微血管病變表現。'},
    hellp:{s:'keep',src:'t',why:'若不是子癲前症，仍要鑑別。'},
    aflp:{s:'keep',src:'t',why:'若不是子癲前症，仍要鑑別。'},
    stechus:{s:'keep',src:'s',why:'教案此段未討論；系統回顧腹瀉（−）、血便（−）。'}},
  analysis:`<p>現病史和過去病史可能相關，要用過去病史重新評估鑑別診斷。</p><ol>
  <li>流產當時 sFlt-1/PlGF <38，不像典型子癲前症；流產後仍有溶血性貧血與腎衰竭。若第一次流產是子癲前症，流產後溶血與腎功能應會恢復；兩者都沒恢復，代表有<b>系統性疾病一直伴隨</b>：SLE、APS，或其他溶血性貧血的疾病，例如 <b>TTP</b> 或 <b>aHUS</b>。</li>
  <li>姊姊年輕時懷孕多重器官衰竭過世、哥哥年輕中風，都是明顯的<b>血栓性微血管病變</b>表現。</li>
  <li>她服用的降血壓藥與其他藥物不會導致腎衰竭或寡尿。</li>
  <li>頭暈：已規律服用 B 群、葉酸、鐵劑，也沒有腸胃道出血證據 → 考慮<b>溶血性貧血加重</b>。視力模糊 → 除了腎、心臟、腸胃，<b>腦神經與眼睛</b>可能也被影響。</li>
  <li>重點：年輕孕婦 26 週出現<b>急性腎衰竭＋心臟衰竭</b>，可能合併呼吸衰竭，神經、腸胃、視力也受影響。若不是子癲前症，重要鑑別有：SLE、APS、TTP、HELLP、AFLP。</li></ol>`},

    {t:'心衰竭的表現',src:'s',b:'<b>充血</b>：頸靜脈怒張、雙下肢水腫、端坐呼吸（躺下更喘）、肝腫大。<b>輸出不足</b>：心跳快、頭暈、四肢冰冷。本例：頸靜脈怒張、雙下肢嚴重水腫、躺下更喘、HR 118；但四肢溫暖、血壓 176/110，不是休克。'},

    {t:'MAHA 怎麼判斷',src:'t',b:'溶血證據：LDH↑、haptoglobin↓、<b>間接</b>膽紅素↑（總 2.7、直接只有 0.3）。加上抹片破碎紅血球、Coombs 陰性 → 微血管病變性溶血性貧血（MAHA），不是自體免疫溶血。'},

    ahus:{s:'keep',src:'t',why:'到此剩下的鑑別診斷之一。'}},
  analysis:`<ol>
  <li>嚴重的<b>急性腎衰竭</b>合併嚴重<b>酸中毒</b>。</li>
  <li>貧血；PT/APTT 正常（不是 DIC）；LDH 升高、haptoglobin 下降、抹片 3+ 破碎紅血球；Coombs 陰性（不是 AIHA）→ 確定為 <b>MAHA</b>。</li>
  <li>同時合併<b>血小板低下</b>。</li>
  <li><b>心肌酵素竄高</b>。</li></ol>
  <p>→ 確認目前為<b>血栓性微血管病變（TMA）</b>，合併急性腎衰竭與心臟受影響。肝功能正常，先排除 AFLP、HELLP；ADAMTS13 80% 排除 TTP；Shiga toxin、O157:H7 陰性排除典型 HUS。</p>

/* ---------- helpers ---------- */
const PH = {want:'想看什麼', ask:'討論', clue:'找線索', ddx:'排鑑別', reveal:'揭曉'};
const PH_HINT = {want:'先想一想：你還想知道什麼？現場討論後再揭曉', ask:'先想一想，等一下現場討論', clue:'點出你覺得會改變判斷的線索（可複選）', ddx:'助教帶著排：看每個診斷的可能性怎麼變', reveal:'對照教案的推理'};
const ST = {open:'待觀察', keep:'持平', up:'↑ 上調', down:'↓ 下調', out:'排除', lead:'最可能'};
const VOTE_OF = {up:'u', lead:'u', keep:'k', down:'d', out:'d'};
const VLAB = {u:'↑ 上調', k:'持平', d:'↓ 下調'};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const phasesOf = i => SECTIONS[i].phases || (SECTIONS[i].units ? ['clue','ddx','reveal'] : ['reveal']);
/* 兩門課共用同一份進度：每段都屬於某一門課，助教切換課程＝跳到那門課的第一段 */
const COURSES = {oli:{tab:'寡尿', brand:'寡尿 · 臨床推理'}, msk:{tab:'骨骼肌肉', brand:'骨骼肌肉 · 理學檢查'}};
const courseOf = i => SECTIONS[i].course || 'oli';
const secsOf = c => SECTIONS.map((s,k)=>k).filter(k=>courseOf(k)===c);
const hasDx = sec => (sec.course||'oli')==='oli';
const mapHTML = sec => sec.map ? `<div class="analysis"><h3>${esc(sec.mapTitle||'結構對照')}</h3><ul class="maplist">${sec.map.map(([k,v])=>`<li><b>${esc(k)}</b>　${esc(v)}</li>`).join('')}</ul></div>` : '';
function statementHTML(sec, ph){
  if(ph==='want' && sec.want) return `<ol class="ask">${sec.want.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>`;
  if(!sec.statement) return '';
  return `<p class="statement">${esc(sec.statement)}</p>` + (ph==='ask' && sec.ask ? `<ol class="ask">${sec.ask.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>` : '');
}
function statusAfter(i){ const m={}; for(let k=0;k<=i;k++){ const v=SECTIONS[k].verdict||{}; for(const d in v) m[d]={...v[d],sec:k}; } return m; }
const dxAt = i => Object.keys(DX).filter(d => DX[d].intro <= i);
/* Impression＝這一段結束時最能解釋全部發現的 1–3 個工作診斷；排除＝有決定性證據，排除後下一段起不再出現 */
const impAt = i => { for(let k=i;k>=0;k--) if(SECTIONS[k].imp) return SECTIONS[k]; return null; };
const impHTML = s => s ? `<div class="imp"><h3>IMPRESSION</h3><ol>${s.imp.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>${s.impNote?`<p class="note">${esc(s.impNote)}</p>`:''}</div>` : '';
/* 第一層＝腎臟哪裡出問題；第二層＝什麼病造成的 */
const TREE = [
  {d:'prerenal'},
  {d:'intrinsic', subs:[
    {label:'腎絲球', ds:['gn']},
    {label:'腎血管（含溶血、微血栓；先不細分 MAHA／AIHA）', ds:['pe','hellp','ttp','ahus','stechus','aps','sle','dic','aiha']},
    {label:'腎小管（ATN 等）', ds:['aflp']}]},
  {d:'postrenal'}];
const RANK = {lead:0, up:1, open:2, keep:2, down:3, out:4};
const ORDER = Object.keys(DX);
function treeOrder(ids, stOf){
  const set=new Set(ids), out=[];
  const by=(a,b)=>RANK[stOf(a)]-RANK[stOf(b)] || ORDER.indexOf(a)-ORDER.indexOf(b);
  for(const t of TREE.filter(t=>set.has(t.d)).sort((a,b)=>by(a.d,b.d))){
    out.push({d:t.d, depth:0});
    for(const s of t.subs||[]){
      const ds=s.ds.filter(d=>set.has(d)).sort(by);
      if(ds.length){ out.push({hd:s.label}); ds.forEach(d=>out.push({d, depth:1})); }
    }
  }
  return out;
}
const validLive = d => d && Number.isInteger(d.sec) && d.sec>=0 && d.sec<SECTIONS.length && phasesOf(d.sec).includes(d.phase);

/* ---------- state ---------- */
const LS='oliguria-case-v1';
function loadMine(){ try{ const o=JSON.parse(localStorage.getItem(LS)||'{}'); return {picks:o.picks||{},votes:o.votes||{}}; }catch(e){ return {picks:{},votes:{}}; } }
function saveMine(){ try{ localStorage.setItem(LS, JSON.stringify(S.mine)); }catch(e){} }
function applyLive(){
  const d=S.roomLive||S.dbLive, was=S.live.sec+'/'+S.live.phase;
  if(validLive(d)){ S.follow=true; S.live={sec:d.sec,phase:d.phase}; S.tam=cleanMarks(d.m); } else S.follow=false;
  if(was!==S.live.sec+'/'+S.live.phase){ S.open=null; window.scrollTo({top:0}); }
  pushPresence(); schedule();
}
/* 助教在 ddx 階段排的每個診斷（u/k/d），隨進度同步給學生；來自資料庫，逐項驗證 */
function cleanMarks(m){ const o={}; if(m&&typeof m==='object') for(const d of Object.keys(m)) if(DX[d]&&VLAB[m[d]]) o[d]=m[d]; return o; }
const taMarksDx = () => S.role==='ta' ? (S.taDx[SECTIONS[S.live.sec].id]||{}) : S.tam;
function pushTA(){ if(!S.room||S.role!=='ta'||S.preview) return; S.room.presence({r:'t', l:{sec:S.live.sec, phase:S.live.phase}}).catch(()=>{}); }
const S = { role:'st', preview:false, live:location.hash==='#msk' ? {sec:secsOf('msk')[0],phase:phasesOf(secsOf('msk')[0])[0]} : {sec:0,phase:'ask'}, follow:false, docExists:false,
  db:null, room:null, roomOk:false, peers:[], taMarks:{}, taDx:{}, tam:{}, shown:{}, mine:loadMine(), open:null, dxOpen:new Set(), note:'' };

/* ---------- aggregation (presence is untrusted: validate every id) ---------- */
function agg(){
  const sec=SECTIONS[S.live.sec], ids=new Set((sec.units||[]).map(u=>u.id));
  const clue={}, vote={}; let n=0, online=0;
  for(const p of S.peers){
    const pr=p.presence||{}; if(pr.r!=='s' || (p.isMe&&p.sameTab)) continue; online++;
    if(pr.s!==sec.id) continue; n++;
    if(Array.isArray(pr.c)) for(const id of new Set(pr.c)) if(ids.has(id)) clue[id]=(clue[id]||0)+1;
  }
  return {n,online,clue,vote};
}

const figHTML = u => (FIGS[u.id] && S.live.phase!=='want') ? `<span class="fig"><img src="${FIGS[u.id].src}" alt="${FIGS[u.id].alt}"><span class="figcap">${FIGS[u.id].cap}</span></span>` : '';
function cardsHTML(sec, prefix){
  if(!sec.cards || S.live.phase==='want' || (sec.id==='cc' && S.live.phase==='ask') || (!hasDx(sec) && S.live.phase!=='reveal')) return '';
  const k = S.open && S.open.startsWith(prefix) ? +S.open.slice(prefix.length) : -1;
  return `<div class="cards"><span class="lbl">${hasDx(sec)?'生理小卡':'補充小卡'}</span>${sec.cards.map((c,j)=>`<button class="cardbtn${j===k?' on':''}" data-act="open" data-k="${prefix}${j}">${esc(c.t)}</button>`).join('')}</div>`
    + (k>=0 ? `<div class="cardbody">${srcTag(sec.cards[k])}${sec.cards[k].b}</div>` : '');
}
function analysisHTML(sec){ return `<div class="analysis"><h3>教案推理</h3>${sec.analysis}</div>`; }
function unitsWrap(sec, inner){ return `<div class="units ${sec.layout}${sec.data?' data':''}">${inner}</div>`; }
function eachUnit(sec, fn){ let g=null, out=''; for(const u of sec.units){ if(u.g && u.g!==g && sec.layout==='list'){ g=u.g; out+=`<div class="grp">${esc(g)}</div>`; } out+=fn(u); } return out; }
/* 預設都是教案；只有助教補充才標出來 */
function srcTag(v){ return v.src==='s' ? `<span class="src s">補充</span>` : ''; }
const infoHTML = u => (u.n||u.w) ? `<span class="assoc"><b>正常值</b>　${esc(u.n)}<br><b>用途</b>　${esc(u.w)}</span>` : '';
const TL = [['pu','目的'],['how','做法'],['nor','正常'],['pos','陽性'],['cmp','對照'],['why','原理']];
const testHTML = u => `<span class="assoc tst">${TL.filter(([k])=>u[k]).map(([k,l])=>`<b>${l}</b>　${esc(u[k])}`).join('<br>')}</span>`;
const assocHTML = u => (u.how||u.nor||u.pu||u.pos) ? testHTML(u) : u.a ? `<span class="assoc">${srcTag({src:u.as})}→ ${esc(u.a)}</span>` : '';
function mskBoardHTML(sec, ph){
  const t=esc(sec.mapTitle||'結構對照');
  if(ph!=='reveal') return `<aside class="board"><h2>${t}</h2><p class="wait">現場討論完再出現。</p></aside>`;
  return `<aside class="board"><h2>${t}</h2>${(sec.map||[]).map(([k,v])=>`<div class="dx"><b>${esc(k)}</b><p class="why">${esc(v)}</p></div>`).join('')||'<p class="wait">重點在左邊的教案推理。</p>'}</aside>`;
}

/* ---------- presenter ---------- */
function renderTA(){
  const i=S.live.sec, sec=SECTIONS[i], ph=S.live.phase, a=agg();
  const marks=S.taMarks[sec.id]||new Set();
  const course=courseOf(i), ids=secsOf(course), last=ids[ids.length-1];
  const steps=ids.map(k=>`<button class="${k===i?'on':k<i?'done':''}" data-act="go" data-sec="${k}">${esc(SECTIONS[k].short||SECTIONS[k].title.split('・')[0])}</button>`).join('');
  const courseSeg=`<select class="course-sel" data-act="course" aria-label="切換主題">${Object.keys(COURSES).map(c=>`<option value="${c}"${c===course?' selected':''}>${COURSES[c].tab}</option>`).join('')}</select>`;
  const segs=phasesOf(i).map(p=>`<button class="${p===ph?'on':''}" data-act="phase" data-phase="${p}">${PH[p]}</button>`).join('');
  const conn = S.roomOk ? `<span class="pill"><span class="dot ok"></span>學生在線 <b class="mono">${a.online}</b>　本段作答 <b class="mono">${a.n}</b></span>`
                        : `<span class="pill"><span class="dot"></span>未連上即時互動</span>`;
  let body=statementHTML(sec, ph);
  if(sec.units && ph!=='want'){
    const shown=S.shown[sec.id]||new Set();
    const prompt = ph==='ask' ? `逐項問大家：${sec.askHint||'這讓你聯想到什麼？'}點一項，顯示教案的聯想。<button class="btn" data-act="showall" style="margin-left:8px">${shown.size?'全部收起':'全部顯示'}</button>` : ph==='clue' ? `${sec.abn?'請大家點出異常的項目。':'請大家點出關鍵線索。'}${S.roomOk?'越多人點，底色越深。':''}點畫面上的句子可以由助教直接標記。`
                 : ph==='ddx' ? (phasesOf(i).includes('clue') ? '線索找完了：' : '看完這段，') + '請助教邊講邊在右側看板排每個診斷：上調、持平、下調。學生手機會同步顯示。'+(sec.info?'點檢驗項目可看正常值與用途。':'') : (sec.rev || (sec.abn?'框線＝異常項目。':'框線＝教案推理用到的線索。'));
    body = unitsWrap(sec, eachUnit(sec, u=>{
      const c=a.clue[u.id]||0, frac=a.n?c/a.n:0, ta=marks.has(u.id);
      const pct=Math.round(Math.max(a.n?frac:0, ta?.6:0)*70);
      const keyed = ph==='reveal' && (sec.abn ? u.ab : (u.key && !sec.assoc));
      const cls=['u']; if(keyed) cls.push('key');
      const showA = sec.assoc && (ph==='reveal' || ((ph==='ask'||ph==='ddx') && shown.has(u.id)));
      const tg=sec.layout==='prose'?'span role="button"':'button', te=sec.layout==='prose'?'span':'button';
      return `<${tg} class="${cls.join(' ')}" data-act="${(ph==='ask'||((sec.assoc||sec.info)&&ph==='ddx'))?'reveal1':'mark'}" data-u="${u.id}" style="background:color-mix(in srgb,var(--heat) ${pct}%,transparent)"><span class="lab">${esc(u.t)}</span>${c&&(ph==='clue'||(sec.assoc&&ph==='ask'))?`<span class="cnt">${c}</span>`:''}${showA?assocHTML(u):''}${sec.info&&(ph==='ddx'||ph==='reveal')&&shown.has(u.id)?infoHTML(u):''}${figHTML(u)}</${te}>`;
    }));
    body = `<p class="prompt">${prompt}</p>${body}`;
  }
  if((i===0||sec.qr) && ph==='ask') body += `<div class="qrbox"><div id="qr" class="qr"></div><div><b>掃描加入，用手機一起作答</b><br><span class="muted">${SITE_URL.replace('https://','')}</span></div></div>`;
  if(ph==='reveal') body += analysisHTML(sec);
  const nextLabel = (()=>{ const ps=phasesOf(i), k=ps.indexOf(ph); if(k<ps.length-1) return PH[ps[k+1]]+' →'; return i<last?'下一段 →':''; })();
  return `
  <header class="bar">
    <span class="brand">${COURSES[course].brand}</span>
    ${courseSeg}
    <nav class="steps">${steps}</nav>
    <span class="seg">${segs}</span>
    <span class="spacer"></span>
    ${conn}
    <button class="btn" data-act="preview">學生畫面</button>
    <details class="more"><summary class="btn" aria-label="更多">⋯</summary><div class="menu"><button class="btn" data-act="talogin">切換 TA</button>${S.docExists?`<button class="btn" data-act="end" title="讓學生回到自由瀏覽">結束同步</button>`:''}</div></details>
  </header>
  ${S.note?`<div class="note">${esc(S.note)}</div>`:''}
  ${!S.docExists && S.db ? `<div class="note">學生目前各自瀏覽。你一按下任何段落或階段，所有學生的手機就會跟著你的進度。</div>`:''}
  <main class="stage">
    <section class="sheet">
      <div class="sec-head"><span class="sec-no">${esc(sec.no)}</span><h1 class="sec-title">${esc(sec.title)}</h1></div>
      ${cardsHTML(sec,'p:')}
      ${body}
      <div class="selfnav"><button class="btn" data-act="prev">← 上一步</button>${nextLabel?`<button class="btn primary" data-act="next">${nextLabel}</button>`:''}</div>
    </section>
    ${hasDx(sec) ? boardHTML(i, ph, a) : mskBoardHTML(sec, ph)}
  </main>`;
}

function boardHTML(i, ph, a){
  const prev=statusAfter(i-1), cur=statusAfter(i), reveal=ph==='reveal', verdict=SECTIONS[i].verdict||{};
  const tam=taMarksDx(), canMark = ph!=='reveal' && S.role==='ta' && !S.preview;
  const live=[], gone=[];
  for(const d of dxAt(i)){
    const before=prev[d]?.s||'open';
    if(before==='out'){ gone.push(d); continue; }
    live.push(d);
  }
  const rows = treeOrder(live, d=>(reveal?cur:prev)[d]?.s||'open').map(({d,hd,depth})=>{
    if(hd) return `<div class="subhd">${esc(hd)}</div>`;
    const st=(reveal?cur:prev)[d]?.s||'open', v=verdict[d], changed=reveal&&v;
    const mk=tam[d];
    const bars = ph!=='reveal' ? `<span class="vbtns" style="margin:6px 0 0">${['u','k','d'].map(x=>canMark?`<button class="${x} ${mk===x?'on':''}" data-act="tadx" data-dx="${d}" data-v="${x}">${VLAB[x]}</button>`:(mk===x?`<button class="${x} on" disabled>${VLAB[x]}</button>`:'')).join('')}</span>`:'';
    const isNew = DX[d].intro===i && i>0;
    const mineLbl = reveal && mk ? `<span class="mine${VOTE_OF[st]!==mk?' diff':''}">課堂 ${VLAB[mk]}${VOTE_OF[st]!==mk?'　≠ 教案':''}</span>` : '';
    return `<div class="dx ${depth?'child':''}${st==='out'?'out':''} ${changed?'changed':''}">
      <div class="dx-top"><button class="dxname" data-act="open" data-k="d:${d}">${esc(DX[d].name)}</button>${isNew?'<span class="new">新</span>':''}${mineLbl}<span class="chip ${st}">${mineLbl?'教案 ':''}${ST[st]}</span></div>
      ${bars}
      ${changed?`<p class="why">${srcTag(v)}${esc(v.why)}</p>`:''}
      ${S.dxOpen.has(d)?`<p class="dxcard">${esc(DX[d].card)}</p>`:''}
    </div>`;
  }).join('');
  return `<aside class="board">
    <h2>鑑別診斷看板</h2>
    <p class="sub">${reveal?'底色＝這一段改變了判斷':(canMark?'邊討論邊排：上調、持平、下調，學生手機在「排鑑別」階段會同步。':'上一段結束時的判斷')}。點病名看說明。</p>
    ${impHTML(impAt(reveal?i:i-1))}
    <p class="listhd">${reveal?'鑑別清單（標「排除」的，下一段起不再出現）':'仍在鑑別'}</p>
    ${rows}
  </aside>`;
}

/* ---------- student ---------- */
function renderST(){
  const i=S.live.sec, sec=SECTIONS[i], ph=S.live.phase;
  const picks=new Set(S.mine.picks[sec.id]||[]);
  let body=statementHTML(sec, ph);
  if(sec.units && ph!=='want' && !(ph==='reveal' && hasDx(sec))){
    const F=sec.abn?'ab':'key';
    const clued=phasesOf(i).includes('clue');
    body += unitsWrap(sec, eachUnit(sec, u=>{
      const p=picks.has(u.id); let cls='u';
      if(ph==='reveal' && !clued) cls+= u.key && !sec.assoc ? ' key' : '';
      else if(p) cls+=' pick';
      const sh=(S.shown[sec.id]||new Set()).has(u.id);
      const act = ((sec.assoc||sec.info) && ph==='ddx') ? 'reveal1' : (ph==='clue'||(sec.assoc&&ph==='ask')) ? 'pick' : 'pick';
      const live = ph==='clue' || (sec.assoc && (ph==='ask'||ph==='ddx')) || (sec.info && ph==='ddx');
      const tg=sec.layout==='prose'?'span role="button"':'button', te=sec.layout==='prose'?'span':'button';
      return `<${tg} class="${cls}" data-act="${act}" data-u="${u.id}" ${live?'':'aria-disabled="true"'}><span class="lab">${esc(u.t)}</span>${sec.assoc&&(ph==='reveal'||(ph==='ddx'&&sh))?assocHTML(u):''}${sec.info&&(ph==='ddx'||ph==='reveal')&&sh?infoHTML(u):''}${figHTML(u)}</${te}>`;
    }));
  }
  if(hasDx(sec) && (ph==='ddx' || (ph==='reveal' && sec.units))){
    const prev=statusAfter(i-1), verdict=sec.verdict||{};
    const list=dxAt(i).filter(d=>(prev[d]?.s)!=='out');
    const tam=taMarksDx();
    body += `<div style="margin-top:20px">${ph==='ddx'?'<p class="prompt">助教正在帶著排鑑別：上調（變可能）、持平、下調（變不可能）。跟著聽就好。</p>':`${impHTML(impAt(i))}<h3 style="font-size:15px;margin:0 0 4px">教案的判斷</h3>`}`
      + treeOrder(list, d=>prev[d]?.s||'open').map(({d,hd,depth})=>{
        if(hd) return `<div class="subhd">${esc(hd)}</div>`;
        const mine=tam[d], v=verdict[d], rc='';
        const btns = ph==='ddx' ? (mine?`<span class="vbtns"><button class="${mine} on" disabled>${VLAB[mine]}</button></span>`:'<span class="vbtns muted" style="font-size:13px">助教還沒排</span>') : `<span class="chip ${v?v.s:'open'}">${v?ST[v.s]:'持平'}</span>`;
        const cmp = ph==='reveal' && v ? `<p class="why">${srcTag(v)}${esc(v.why)}</p>` : '';
        return `<div class="vote ${depth?'child':''}${rc}"><div class="vote-top"><button class="cardbtn${S.dxOpen.has(d)?' on':''}" data-act="open" data-k="d:${d}">${esc(DX[d].name)}</button>${DX[d].intro===i&&i>0?'<span class="new">新</span>':''}${btns}</div>${cmp}${S.dxOpen.has(d)?`<p class="dxcard">${esc(DX[d].card)}</p>`:''}</div>`;
      }).join('') + '</div>';
  }
  if(ph==='reveal') body += analysisHTML(sec) + (hasDx(sec)?'':mapHTML(sec));
  const ids=secsOf(courseOf(i));
  const nav = S.follow ? '' : `<div class="selfnav"><button class="btn" data-act="prev">← 上一步</button><button class="btn primary" data-act="next">下一步 →</button></div>`;
  const status = S.follow ? `<span class="pill"><span class="dot ok"></span>跟著助教進度</span>` : `<span class="pill"><span class="dot"></span>自己瀏覽</span>`;
  return `<div class="phone">
    <header class="bar"><span class="brand">${COURSES[courseOf(i)].brand}</span>${(S.role==='st'&&!S.preview&&S.rt)?'<button class="btn" data-act="talogin" style="margin-left:8px">TA 登入</button>':''}<span class="spacer"></span>${status}${S.preview?'<button class="btn" data-act="preview">回主持畫面</button>':''}</header>
    ${S.note?`<div class="note">${esc(S.note)}</div>`:''}
    ${!S.roomOk&&!S.preview?'<div class="note">你的作答只會留在這支手機上，不會出現在投影幕。</div>':''}
    <section class="sheet">
      <span class="phase-tag">${PH[ph]}</span>
      <div class="sec-head"><span class="sec-no">${esc(sec.no)}</span><h1 class="sec-title">${esc(sec.title)}</h1></div>
      ${cardsHTML(sec,'p:')}
      <p class="prompt">${esc(ph==='ask'&&sec.askHint?sec.askHint:(ph==='clue'&&sec.abn?'點出你覺得異常的項目（可複選）':PH_HINT[ph]+(ph==='ddx'&&sec.info?'　點檢驗項目可看正常值與用途。':'')))}</p>
      ${body}
      ${nav}
    </section>
    <p class="foot">第 ${ids.indexOf(i)+1} / ${ids.length} 段</p>
    <p class="foot mono" style="opacity:.7" ${location.hash==='#debug'?'':'hidden'}>連線檢查：執行環境 ${S.rt?'✓':'✗'}　即時 ${S.roomOk?'✓':'✗'}　資料庫 ${S.db?'✓':'✗'}　在線 ${S.peers.length}　助教訊號 ${(S.roomLive||S.dbLive)?'✓':'✗'}</p>
  </div>`;
}

/* ---------- render + actions ---------- */
let raf=0;
const SITE_URL=location.origin+location.pathname;
function drawQR(){ const el=document.getElementById('qr'); if(!el||!window.QRCode) return; el.innerHTML=''; try{ new QRCode(el,{text:SITE_URL,width:168,height:168,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){} }
function render(){ raf=0; document.getElementById('app').innerHTML = (S.role==='ta'&&!S.preview) ? renderTA() : renderST(); drawQR(); }
window.addEventListener('load',()=>drawQR());
function schedule(){ if(!raf) raf=requestAnimationFrame(render); }

function pushPresence(){
  if(!S.room || S.role!=='st') return;
  const id=SECTIONS[S.live.sec].id;
  S.room.presence({r:'s', s:id, c:S.mine.picks[id]||[]}).catch(()=>{});
}

let writing=false, dirty=false;
async function writeLive(){
  if(!S.db) return; dirty=true; if(writing) return; writing=true;
  while(dirty){ dirty=false;
    try{ await S.db.doc('live/state').set({sec:S.live.sec, phase:S.live.phase, m:S.taDx[SECTIONS[S.live.sec].id]||{}}); S.docExists=true; S.note=''; }
    catch(e){ S.note='進度沒有同步到學生手機（'+((e&&e.code)||'錯誤')+'）。'; dirty=false; }
  }
  writing=false; schedule();
}

function go(sec, phase){
  S.live={sec,phase}; S.open=null;
  if(S.role==='ta' && !S.preview){ writeLive(); pushTA(); }
  render(); pushPresence(); window.scrollTo({top:0});
}
function step(dir){
  const i=S.live.sec, ps=phasesOf(i), k=ps.indexOf(S.live.phase), ids=secsOf(courseOf(i)), lo=ids[0], hi=ids[ids.length-1];
  if(dir>0){ if(k<ps.length-1) go(i,ps[k+1]); else if(i<hi) go(i+1,phasesOf(i+1)[0]); }
  else { if(k>0) go(i,ps[k-1]); else if(i>lo){ const p=phasesOf(i-1); go(i-1,p[p.length-1]); } }
}
const canNav = () => (S.role==='ta' && !S.preview) || !S.follow;

document.getElementById('app').addEventListener('change', e=>{
  const s=e.target.closest('select[data-act="course"]'); if(!s) return;
  if(canNav() && COURSES[s.value]){ const k=secsOf(s.value)[0]; go(k, phasesOf(k)[0]); }
  else render && render();
});
document.getElementById('app').addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, sec=SECTIONS[S.live.sec];
  if(act==='go' && canNav()) go(+b.dataset.sec, phasesOf(+b.dataset.sec)[0]);
  else if(act==='phase' && canNav()) go(S.live.sec, b.dataset.phase);
  else if(act==='course' && canNav() && COURSES[b.dataset.course]){ const k=secsOf(b.dataset.course)[0]; go(k, phasesOf(k)[0]); }
  else if(act==='next' && canNav()) step(1);
  else if(act==='prev' && canNav()) step(-1);
  else if(act==='open' && b.dataset.k.startsWith('d:')){ const d=b.dataset.k.slice(2); S.dxOpen.has(d)?S.dxOpen.delete(d):S.dxOpen.add(d); render(); }
  else if(act==='open'){ S.open = S.open===b.dataset.k ? null : b.dataset.k; render(); }
  else if(act==='reveal1'){ const m=S.shown[sec.id]=S.shown[sec.id]||new Set(); m.has(b.dataset.u)?m.delete(b.dataset.u):m.add(b.dataset.u); render(); }
  else if(act==='showall'){ const m=S.shown[sec.id]; S.shown[sec.id] = m&&m.size ? new Set() : new Set(sec.units.map(u=>u.id)); render(); }
  else if(act==='mark'){ const m=S.taMarks[sec.id]=S.taMarks[sec.id]||new Set(); m.has(b.dataset.u)?m.delete(b.dataset.u):m.add(b.dataset.u); render(); }
  else if(act==='pick'){
    if(S.live.phase!=='clue' && !(sec.assoc && S.live.phase==='ask')) return;
    const arr=new Set(S.mine.picks[sec.id]||[]); arr.has(b.dataset.u)?arr.delete(b.dataset.u):arr.add(b.dataset.u);
    S.mine.picks[sec.id]=[...arr]; saveMine(); render(); if(!S.preview) pushPresence();
  }
  else if(act==='tadx' && S.role==='ta' && !S.preview){
    const v=S.taDx[sec.id]=S.taDx[sec.id]||{}; const d=b.dataset.dx;
    if(v[d]===b.dataset.v) delete v[d]; else v[d]=b.dataset.v;
    writeLive(); render();
  }
  else if(act==='talogin'){ if(window.__taLogin) window.__taLogin(); }
  else if(act==='preview'){ S.preview=!S.preview; render(); }
  else if(act==='end' && (S.db||S.room)){ if(S.room) S.room.presence({r:'x'}).catch(()=>{}); (S.db?S.db.doc('live/state').delete():Promise.resolve()).then(()=>{ S.docExists=false; schedule(); }).catch(err=>{ S.note='沒能結束同步（'+((err&&err.code)||'錯誤')+'）。'; schedule(); }); }
});
document.addEventListener('keydown', e=>{
  if(!(S.role==='ta'&&!S.preview) || e.target.closest('input,textarea')) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); step(1); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); step(-1); }
});

/* ---------- runtime (Firebase) ---------- */
function showLogin(auth){
  const el=document.getElementById('login'); el.hidden=false;
  el.style.cssText='position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px';
  el.innerHTML='<form style="background:var(--sheet);color:var(--ink);border-radius:12px;padding:20px;max-width:360px;width:100%;display:grid;gap:10px"><b>老師登入</b><input id="lg-e" type="text" placeholder="代號或 Email" autocomplete="username" autocapitalize="off" style="font:inherit;padding:8px"><input id="lg-p" type="password" placeholder="密碼" autocomplete="current-password" style="font:inherit;padding:8px"><div id="lg-m" style="color:var(--bad);font-size:13px"></div><div style="display:flex;gap:8px"><button class="btn primary" type="submit">登入</button><button class="btn" type="button" id="lg-c">取消</button></div></form>';
  el.querySelector('#lg-c').onclick=()=>{ el.hidden=true; location.hash=''; };
  el.querySelector('form').onsubmit=async ev=>{ ev.preventDefault();
    try{ await auth.signInWithEmailAndPassword(((v)=>/^\d+$/.test(v)?v+'@medteaching-e190d.web.app':v)(el.querySelector('#lg-e').value.trim()), el.querySelector('#lg-p').value); try{sessionStorage.setItem('taFresh','1')}catch(_){} location.hash='#ta'; location.reload(); }
    catch(e){ el.querySelector('#lg-m').textContent='登入失敗（'+(e.code||'錯誤')+'）'; } };
}
async function init(){
  render();
  const cfg=window.FIREBASE_CONFIG;
  S.rt=!!(window.firebase && cfg && cfg.apiKey && !/YOUR_/.test(cfg.apiKey));
  if(!S.rt){ S.note='尚未設定 Firebase（firebase-config.js），目前只能各自瀏覽。'; render(); return; }
  firebase.initializeApp(cfg);
  const auth=firebase.auth(), rtdb=firebase.database();
  if(location.hash==='#logout'){ await auth.signOut(); location.hash=''; }
  let user=await new Promise(res=>{ const un=auth.onAuthStateChanged(u=>{ un(); res(u); }); });
  if(!user){ try{ user=(await auth.signInAnonymously()).user; }catch(e){ S.note='無法連線（'+(e.code||'錯誤')+'），先自己往下看。'; if(location.hash==='#ta') showLogin(auth); render(); return; } }
  const teacher=!user.isAnonymous, uid=user.uid;
  window.__taLogin=()=>showLogin(auth);
  if(location.hash==='#ta' && !teacher) showLogin(auth);
  S.role=teacher?'ta':'st';
  /* shim with the same shape the page code already uses */
  const liveRef=rtdb.ref('live'), meRef=rtdb.ref('presence/'+uid);
  S.room={
    presence(o){ if(o.r!=='s') return Promise.resolve(); meRef.onDisconnect().remove(); return meRef.set(o); },
    onPeers(cb,off){
      rtdb.ref('presence').on('value',snap=>{ const v=snap.val()||{}; cb({peers:Object.keys(v).map(k=>({presence:v[k],isMe:k===uid,sameTab:false}))}); }, ()=>off&&off());
      rtdb.ref('.info/connected').on('value',s=>{ if(!s.val()) off&&off(); else { S.roomOk=true; schedule(); if(S.role==='st') pushPresence(); } });
    }};
  S.roomOk=true;
  S.room.onPeers(ch=>{ S.peers=ch.peers; if(S.role==='ta'&&!S.preview) schedule(); }, ()=>{ S.roomOk=false; schedule(); });
  S.db={ doc(){ return {
    set(d){ return liveRef.set(d); },
    delete(){ return liveRef.remove(); },
    onSnapshot(cb,err){ liveRef.on('value',snap=>cb({exists:snap.exists(),data:()=>snap.val(),metadata:{fromCache:false}}), err); }
  }; } };
  let got=false;
  const timer=setTimeout(()=>{ if(!got){ S.note='還連不上助教的進度，先自己往下看。'; schedule(); } },10000);
  S.db.doc().onSnapshot(snap=>{
    got=true; clearTimeout(timer); if(S.note.startsWith('還連不上')) S.note='';
    const d=snap.exists?snap.data():null; S.docExists=!!snap.exists;
    if(S.role==='st'){ S.dbLive=validLive(d)?d:null; applyLive(); return; }
    else if(validLive(d) && !writing && !dirty){ S.live={sec:d.sec,phase:d.phase}; const mm=cleanMarks(d.m); if(Object.keys(mm).length||!S.taDx[SECTIONS[d.sec].id]) S.taDx[SECTIONS[d.sec].id]=mm; }
    schedule();
  }, err=>{ clearTimeout(timer); S.follow=false; S.note='讀不到助教的進度，先自己往下看。'; schedule(); });
  render();
}
init();
</script>
